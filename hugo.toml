baseURL = 'https://ss44.ca/'
locale = 'en-ca'
title = 'Shajinder Singh Padda ~ a guy sitting in front of a computer'
theme = "hugo-theme-nightfall"
ignoreFiles = ["cobalt-cv", "cobalt\\.cv"]

[menu]
  [[menu.header]]
    name = "notes"
    weight = 0
    url = "notes"
    pre = "fa-solid fa-note-sticky"

  [[menu.header]]
    name = "resume"
    weight = 2
    url = "resume"
    pre = "fa-solid fa-file-code"

[params]
description = "Senior Systems Architect and Full Stack Developer with 20+ years of experience."
images = ["/meta-preview.png"]
user = "ss"
hostname = "ss44.ca"

rotating_titles = [
  "oh, hi.",
  "hello there.",
  "greetings.",
  "eh, yo!",
  "ola!"
]
rotating_titles_duration = 5

[params.author]
  name = "Shajinder Singh Padda"

[[params.social]]
key = 0
name = "github"
url = "https://github.com/ss44"
target = "_blank"
aria = "GitHub Profile"
icon = "fa-brands fa-github"



[[params.social]]
key = 2
name = "linkedIn"
url = "https://www.linkedin.com/in/ss44"
aria = "LinkedIn Profile"
icon = "fa-brands fa-linkedin"

[outputs]
  home = ["HTML", "RSS", "README"]

[outputFormats]
  [outputFormats.README]
    mediaType = "text/markdown"
    baseName = "README"
    isPlainText = true
    isHTML = false
